name: Bug report
description: Report a reproducible problem in Ionic Essential.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Ionic Essential. Remove credentials, customer data, private contracts, and other sensitive content before submitting.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This is not a security vulnerability. I will use the private process in SECURITY.md for security reports.
          required: true

  - type: input
    id: version
    attributes:
      label: Ionic version
      description: Use the About screen or run `ionic version`.
      placeholder: 0.6.2
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Desktop app
        - CLI
        - MCP server
        - Python library
        - Build or packaging
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, Python or Node version, and relevant provider/runtime version.
      placeholder: Windows 11 x64; Python 3.12
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest reliable sequence of steps, commands, or sanitized fixture content.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Add relevant logs, screenshots, or tracebacks after removing secrets and proprietary content.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include regressions, workarounds, or related issue links.
